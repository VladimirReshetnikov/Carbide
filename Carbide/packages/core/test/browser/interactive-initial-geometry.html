<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Carbide interactive-terminal smoke: initial WindowWidth/Height</title>
</head>
<body>
  <pre id="result">pending</pre>
  <script type="module">
    import { CarbideSession, BrowserHostAdapter } from "/dist/index.js";

    const resultEl = document.getElementById("result");
    resultEl.dataset.status = "module-imported";

    // Deliberately NOT 80x24. Every other interactive fixture uses exactly 80x24, which is
    // also the hard-coded fallback CarbideConsole reports when the terminal's real geometry
    // never arrives — so the whole suite was blind to whether it arrives at all.
    const COLS = 120;
    const ROWS = 40;

    function makeInteractiveTerminal(cols, rows) {
      const chunks = [];
      const listeners = new Set();
      const resizeListeners = new Set();
      return {
        cols, rows,
        write(data) {
          chunks.push(typeof data === "string" ? data : new TextDecoder().decode(data));
        },
        onData(cb) { listeners.add(cb); return { dispose() { listeners.delete(cb); } }; },
        onResize(cb) { resizeListeners.add(cb); return { dispose() { resizeListeners.delete(cb); } }; },
        getFullText() { return chunks.join(""); },
      };
    }

    async function run() {
      const adapter = new BrowserHostAdapter({
        frameworkAssetsBaseUrl: new URL(
          "/src/bin/Release/net10.0/publish/wwwroot/_framework/",
          window.location.origin,
        ).toString(),
      });
      const terminal = makeInteractiveTerminal(COLS, ROWS);
      const session = await CarbideSession.initializeAsync({ hostAdapter: adapter });
      try {
        const project = session.createProject();
        // Read the geometry immediately, before any resize event is delivered — both through
        // Carbide's own API and through the T3-forked stock Console.
        project.addSource(
          "Program.cs",
          'using Carbide.Terminal;\n' +
            'Console.WriteLine($"carbide: {CarbideConsole.WindowWidth}x{CarbideConsole.WindowHeight}");\n' +
            'Console.WriteLine($"stock: {Console.WindowWidth}x{Console.WindowHeight}");\n',
        );
        const handle = project.runInteractive({ terminal });
        const runResult = await handle.exitPromise;
        return { runResult, fullText: terminal.getFullText(), expected: `${COLS}x${ROWS}` };
      } finally {
        await session.shutdown();
      }
    }

    window.addEventListener("error", (e) => {
      if (resultEl.dataset.status === "module-imported" || resultEl.dataset.status == null) {
        resultEl.textContent = "UNCAUGHT: " + e.message;
        resultEl.dataset.status = "error";
      }
    });
    window.addEventListener("unhandledrejection", (e) => {
      if (resultEl.dataset.status === "module-imported" || resultEl.dataset.status == null) {
        const reason = e.reason;
        resultEl.textContent = "UNHANDLED: " + (reason?.stack ?? reason);
        resultEl.dataset.status = "error";
      }
    });

    run()
      .then((payload) => {
        resultEl.textContent = JSON.stringify(payload);
        resultEl.dataset.status = payload.runResult.success ? "ok" : "fail";
      })
      .catch((err) => {
        resultEl.textContent = "ERR: " + (err?.stack ?? err);
        resultEl.dataset.status = "error";
      });
  </script>
</body>
</html>
